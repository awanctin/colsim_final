[build-system]
requires = ["hatchling >= 1.26", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "colsim"
version = "1.0.0"
description = "Multi-vessel maritime simulator for COLREGs-compliant collision avoidance"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Antoine Wanctin" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.optional-dependencies]
kras = ["sb3-contrib==2.6.0"]

[project.scripts]
colsim-train = "colsim.rl.train_cert:main"
colsim-eval = "colsim.rl.evaluate_cert:main"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["colsim"]
